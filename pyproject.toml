[project]
name = "harunobu-evaluation-artifacts"
version = "1.0.0"
description = "Reproducibility scripts and derived evaluation artifacts for harunobu"
requires-python = ">=3.12"
dependencies = [
  "harunobu @ git+https://github.com/digital-go-jp/machine_readability_rule.git@516bd2c060eb529ec1c3a1976ee07267c323f354#subdirectory=sample_app",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "openpyxl>=3.1",
  "pydantic>=2.11",
  "xlrd>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "cffconvert==2.0.0",
    "pyyaml>=6.0",
]
